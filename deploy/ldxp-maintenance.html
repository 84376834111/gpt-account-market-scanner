<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>LDXP 扫货台正在恢复</title>

<body>
